<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Maromba — controle de treino</title>
  <meta name="theme-color" content="#101113"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Maromba"/>
  <link rel="manifest" href="manifest.json"/>

  <!-- Favicon: SVG vetorial (não depende dos ícones PWA gerados) com
       fallback em PNG pra navegadores/leitores mais antigos. -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png"/>
  <link rel="apple-touch-icon" href="icons/icon-192.png"/>
  <link rel="mask-icon" href="favicon.svg" color="#E9BD4A"/>

  <!--
    Cache busting: cada arquivo estático abaixo carrega com "?v=APP_VERSION".
    Como o Cloudflare (e o cache do navegador) guardam a resposta por URL
    completa, mudar essa query string força buscar a versão nova depois de
    um deploy, mesmo que o cache antigo ainda não tenha expirado.

    IMPORTANTE: sempre que publicar uma mudança em style.css, app.js,
    bodymap.js, data.js ou taco.js, suba o número de versão AQUI e também
    na constante APP_VERSION no topo do sw.js (mantendo os dois iguais).
  -->
  <link rel="stylesheet" href="style.css?v=11"/>
</head>
<body>
  <div class="app-shell">
    <nav class="sidebar">
      <div class="sidebar-brand">
        <div>
          <span class="brand-word">MAROMBA</span>
          <span class="brand-tag">seus treinos, sua régua</span>
        </div>
      </div>
      <div class="sidebar-nav">
        <button class="nav-btn active" data-tab="meus-treinos">
          <svg class="icon" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
          <span>Meus treinos</span>
        </button>
        <button class="nav-btn" data-tab="sessao">
          <svg class="icon" viewBox="0 0 24 24"><path d="M3 12h4l2 7 4-14 2 7h6"/></svg>
          <span>Treino ativo</span>
          <span class="nav-live-dot"></span>
        </button>
        <button class="nav-btn nav-hide-mobile" data-tab="historico">
          <svg class="icon" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l3 3"/></svg>
          <span>Histórico</span>
        </button>
        <div class="nav-divider nav-hide-mobile"></div>
        <button class="nav-btn" data-tab="dieta">
          <svg class="icon" viewBox="0 0 24 24"><path d="M6 2v6a2 2 0 0 0 4 0V2"/><path d="M8 2v20"/><path d="M18 2c-2.2 0-3.5 2.5-3.5 6.5S15.8 15 18 15"/><path d="M18 2v20"/></svg>
          <span>Dieta</span>
        </button>
        <button class="nav-btn" data-tab="agua">
          <svg class="icon" viewBox="0 0 24 24"><path d="M12 2.5c2.8 3.6 7 9.4 7 13a7 7 0 1 1-14 0c0-3.6 4.2-9.4 7-13z"/></svg>
          <span>Água</span>
        </button>
        <div class="nav-divider nav-hide-mobile"></div>
        <button class="nav-btn nav-hide-mobile" data-tab="equipamentos">
          <svg class="icon" viewBox="0 0 24 24"><path d="M2 9v6"/><path d="M22 9v6"/><path d="M4 7v10"/><path d="M20 7v10"/><path d="M7 12h10"/></svg>
          <span>Equipamentos</span>
        </button>
        <button class="nav-btn nav-hide-mobile" data-tab="exercicios">
          <svg class="icon" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8"/><path d="M8 12h8"/><path d="M8 16h5"/></svg>
          <span>Exercícios</span>
        </button>

        <!-- Grupo "mais" — só aparece no rodapé mobile (ver media query em
             style.css). Reúne Histórico, Equipamentos e Exercícios num menu
             pra não poluir o rodapé; no desktop fica sempre oculto porque
             esses três já aparecem soltos na barra lateral acima. -->
        <div class="nav-more" id="nav-more">
          <button class="nav-btn nav-more-toggle" id="btn-nav-more" type="button" title="Mais opções">
            <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
            <span>Mais</span>
          </button>
          <div class="nav-more-menu" id="nav-more-menu" hidden>
            <button class="nav-btn" data-tab="historico">
              <svg class="icon" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l3 3"/></svg>
              <span>Histórico</span>
            </button>
            <button class="nav-btn" data-tab="equipamentos">
              <svg class="icon" viewBox="0 0 24 24"><path d="M2 9v6"/><path d="M22 9v6"/><path d="M4 7v10"/><path d="M20 7v10"/><path d="M7 12h10"/></svg>
              <span>Equipamentos</span>
            </button>
            <button class="nav-btn" data-tab="exercicios">
              <svg class="icon" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8"/><path d="M8 12h8"/><path d="M8 16h5"/></svg>
              <span>Exercícios</span>
            </button>
          </div>
        </div>
      </div>
      <div class="sidebar-footer">
        <button class="nav-btn-config" id="btn-config">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 13.5a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.55V19.6a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.98 18a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87A1.7 1.7 0 0 0 3.07 12.5H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.65 7.4a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 3.04a1.7 1.7 0 0 0 1.03-1.55V1.4a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15.02 3a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.35 7.4c.29.63.9 1.05 1.58 1.1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"/></svg>
          <span>Ajustes</span>
        </button>
      </div>
    </nav>

    <main id="app" class="main"></main>

    <button id="fab-add" class="fab" title="Adicionar treino">
      <svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <span class="fab-label">Adicionar treino</span>
  </div>

  <div id="modal-montar" class="modal-overlay" hidden>
    <div class="modal-panel modal-panel-lg">
      <button class="modal-close" id="btn-close-montar" title="Fechar">
        <svg class="icon" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <div id="montar-mount"></div>
    </div>
  </div>

  <div id="modal-config" class="modal-overlay" hidden>
    <div class="modal-panel modal-panel-lg">
      <button class="modal-close" id="btn-close-config" title="Fechar">
        <svg class="icon" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <h1>Ajustes</h1>
      <p class="sub">Backup e restauração dos seus dados salvos neste navegador.</p>
      <div id="config-mount"></div>
    </div>
  </div>

  <div id="modal-exercicio-custom" class="modal-overlay" hidden>
    <div class="modal-panel modal-panel-lg">
      <button class="modal-close" id="btn-close-exercicio-custom" title="Fechar">
        <svg class="icon" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <div id="exercicio-custom-mount"></div>
    </div>
  </div>

  <div id="modal-refeicao" class="modal-overlay" hidden>
    <div class="modal-panel modal-panel-lg">
      <button class="modal-close" id="btn-close-refeicao" title="Fechar">
        <svg class="icon" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <div id="refeicao-mount"></div>
    </div>
  </div>

  <div id="modal-alimento-custom" class="modal-overlay" hidden>
    <div class="modal-panel modal-panel-lg">
      <button class="modal-close" id="btn-close-alimento-custom" title="Fechar">
        <svg class="icon" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <div id="alimento-custom-mount"></div>
    </div>
  </div>

  <div id="modal-meta-dieta" class="modal-overlay" hidden>
    <div class="modal-panel">
      <button class="modal-close" id="btn-close-meta-dieta" title="Fechar">
        <svg class="icon" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <div id="meta-dieta-mount"></div>
    </div>
  </div>

  <div id="modal-agua-config" class="modal-overlay" hidden>
    <div class="modal-panel">
      <button class="modal-close" id="btn-close-agua-config" title="Fechar">
        <svg class="icon" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <div id="agua-config-mount"></div>
    </div>
  </div>

  <div id="modal-confirm" class="modal-overlay confirm-overlay" hidden>
    <div class="modal-panel modal-panel-sm">
      <p id="confirm-msg" class="confirm-msg"></p>
      <div class="actions-row confirm-actions">
        <button id="btn-confirm-ok" class="btn btn-danger">Confirmar</button>
        <button id="btn-confirm-cancel" class="btn btn-ghost">Cancelar</button>
      </div>
    </div>
  </div>

  <input type="file" id="input-importar-json" accept="application/json" hidden/>

  <script src="data.js?v=11"></script>
  <script src="taco.js?v=11"></script>
  <script src="bodymap.js?v=11"></script>
  <script src="app.js?v=11"></script>
</body>
</html>
